    <!-- Preconnect to image + font origins. The DNS+TLS round-trip
         for fonts.googleapis.com / fonts.gstatic.com blocks the
         first paint when fonts aren't preconnect-ed, causing FOUT. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

         in parallel with the rest of the head, before it sees the

    <!-- Keep the no-JavaScript summary from flashing before the app mounts. -->
    <style>html.app-booting #initial-page { display: none; }</style>
    <script>
      document.documentElement.classList.add('app-booting');
      window.setTimeout(function () {
        // Restore useful content if the application fails to start.
        if (document.getElementById('initial-page')) document.documentElement.classList.remove('app-booting');
      }, 10000);
    </script>
    <!-- Instant theme restore — prevents white flash for dark mode users -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme');
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (!saved) {
          var hour = new Date().getHours();
          if (hour < 6 || hour >= 18) {
            document.documentElement.classList.add('dark');
          }
        }
      })();
    </script>
