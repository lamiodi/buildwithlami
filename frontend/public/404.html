<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | BuildWithLami</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="/2.png" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 2rem;
    }
    .logo {
      height: 48px;
      margin-bottom: 2rem;
    }
    .code {
      font-size: 6rem;
      font-weight: 800;
      color: #ff5500;
      line-height: 1;
      margin-bottom: 1rem;
      letter-spacing: -2px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 1rem;
    }
    p {
      color: #888888;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-block;
      background: #ff5500;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      transition: background 0.2s ease;
    }
    .btn:hover {
      background: #e04b00;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/1.png" alt="BuildWithLami" class="logo" />
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/" class="btn">Return to Homepage</a>
  </div>
</body>
</html>
