name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    name: Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Frontend ────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          # Build-time env vars. Vite only embeds VITE_* values;
          # this prevents the build from failing when these are
          # unset in CI.
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Test admin calculations
        working-directory: frontend
        run: npm run test:admin

      # ── Backend ────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # We deliberately skip a full `node src/index.js` start
      # here because the CI environment has no DATABASE_URL.
      # The smoke test below loads the modules to catch
      # syntax / import errors without needing a live DB.
      - name: Smoke-test backend imports
        working-directory: backend
        run: node --check src/index.js && node --check src/config/db.js

  admin-journey:
    name: Isolated client and admin journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bwl_admin_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Test client onboarding, delivery and handover
        working-directory: backend
        run: npm run test:isolated
        env:
          BWL_ISOLATED_TEST: '1'
          TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/bwl_admin_test
